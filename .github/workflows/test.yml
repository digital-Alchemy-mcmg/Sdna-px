name: Spatial DNA regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Exercise Scout A1-A5 mechanical fixture
        run: PYTHONPATH=src python scripts/run_scout_workbench.py fixtures/scout_a_scope_fixture.json fixtures/scout_a_records_fixture.json artifacts/scout
      - name: Compile JOB-002
        run: PYTHONPATH=src python scripts/run_job_002.py
      - name: Run full Scout pipeline
        run: PYTHONPATH=src python scripts/run_pipeline.py fixtures/job_002_scout_observation.json --strategy strategies/hospitality_operations.json -o artifacts/job_002_from_scout.json
      - name: Exercise batch throughput
        run: |
          mkdir -p /tmp/sdna-batch-in
          cp fixtures/job_002_scout_observation.json /tmp/sdna-batch-in/JOB-002.json
          PYTHONPATH=src python scripts/run_batch.py /tmp/sdna-batch-in artifacts/batch --strategy strategies/hospitality_operations.json
      - name: Syntax-check passive observer
        run: node --check viewer/app.js
      - name: Build Three.js observer
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Preserve projection receipt
        uses: actions/upload-artifact@v4
        with:
          name: job-002-projection
          path: |
            artifacts/job_002_projection.json
            artifacts/job_002_from_scout.json
            artifacts/batch/batch_manifest.json
      - name: Preserve Three.js observer build
        uses: actions/upload-artifact@v4
        with:
          name: spatial-dna-observer
          path: web/dist
