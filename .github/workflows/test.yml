name: Spatial DNA regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile JOB-002
        run: PYTHONPATH=src python scripts/run_job_002.py
      - name: Exercise batch throughput
        run: |
          mkdir -p /tmp/sdna-batch-in
          cp fixtures/job_002.json /tmp/sdna-batch-in/JOB-002.json
          PYTHONPATH=src python scripts/run_batch.py /tmp/sdna-batch-in artifacts/batch --strategy strategies/hospitality_operations.json
      - name: Syntax-check passive observer
        run: node --check viewer/app.js
      - name: Preserve projection receipt
        uses: actions/upload-artifact@v4
        with:
          name: job-002-projection
          path: artifacts/job_002_projection.json
